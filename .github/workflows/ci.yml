name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -m "not r"

  r-and-stage-a:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pinned R environment (R 4.4.3, qtl2 0.46 from conda-forge)
        run: |
          uv sync --locked --group dev --group renv
          uv run python scripts/make_r_env.py .renv
          echo "$PWD/.renv/bin" >> "$GITHUB_PATH"
      - name: testthat
        # Drop the runner's R library paths so only the pinned env is used.
        run: |
          env -u R_LIBS -u R_LIBS_SITE -u R_HOME R_LIBS_USER=/dev/null R_ENVIRON_USER=/dev/null \
            Rscript -e 'print(.libPaths()); testthat::test_dir("r/tests/testthat", stop_on_failure = TRUE)'
      - name: pytest including Stage A (synthetic data, no downloads)
        run: uv run pytest -q
