# Numbers printed in the R/qtl2 user guide (kbroman/qtl2 gh-pages commit
# f39901f3, assets/vignettes/user_guide.html). Same data and same software, so
# tolerances are tight: positions to within one 1-cM grid step, LOD to 0.01.
paper:
  doi: none (R/qtl2 user guide)
  citation: Broman KW. R/qtl2 user guide, iron example (kbroman.org/qtl2, gh-pages f39901f3)
  position_units: cM
claims:
