     trait: liver, chr: "2", pos_mb: 56.8, lod: 4.9576, tolerance: {pos_mb: 1, pos_ci: 0, lod_abs: 0.01, threshold_lod: 4}}
  - {id: B2, kind: qtl_peak, source: "user guide, find_peaks table", quote: "liver 7 50.1 4.0508 13.1 53.6",
