[project]
name = "repro-check"
version = "0.1.0"
description = "Rerun published genetics analyses from public data and check each claim against a pre-set tolerance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
repro-check = "repro_check.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
renv = ["py-rattler>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repro_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["r: needs Rscript with qtl2 (pinned env)", "network: downloads pinned public inputs"]
